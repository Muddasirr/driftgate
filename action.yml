name: driftgate
description: Run an LLM eval suite, compare it with the last run on your default branch, and comment the diff on the pull request.
author: Muddasir Rizwan
branding:
  icon: shield
  color: blue

inputs:
  suite:
    description: Path to the suite YAML file.
    required: true
  args:
    description: Extra arguments for `driftgate run` (for example `--provider gpt-4o-mini --tag smoke`).
    required: false
    default: ""
  baseline-branch:
    description: Branch whose latest successful run is the baseline. Defaults to the repository's default branch.
    required: false
    default: ""
  artifact-name:
    description: Artifact name used to store and fetch results. Use a different name per suite.
    required: false
    default: driftgate-results
  comment:
    description: Post (or update) a pull request comment with the report.
    required: false
    default: "true"
  fail-on-gate:
    description: Fail the job when the gate fails. Set to "false" to report without blocking.
    required: false
    default: "true"
  python-version:
    description: Python version to run driftgate with.
    required: false
    default: "3.12"
  github-token:
    description: Token used to download the baseline artifact and post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: '"true" if the gate passed.'
    value: ${{ steps.run.outputs.passed }}
  report:
    description: Path to the Markdown report.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install driftgate
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}[anthropic]"

    - name: Fetch baseline
      id: baseline
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.baseline-branch || github.event.repository.default_branch }}
        ARTIFACT: ${{ inputs.artifact-name }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/driftgate-baseline"
        mkdir -p "$dir"
        echo "path=$dir/results.json" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_REF_NAME" = "$BRANCH" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "On $BRANCH: this run becomes the new baseline."
          exit 0
        fi
        workflow_file=$(basename "${WORKFLOW_REF%@*}")
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow_file" \
          --branch "$BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
        if [ -z "$run_id" ]; then
          echo "No successful run on $BRANCH yet; comparing against nothing."
          exit 0
        fi
        gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$dir" \
          || echo "No '$ARTIFACT' artifact in run $run_id; comparing against nothing."

    - name: Run suite
      id: run
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        EXTRA_ARGS: ${{ inputs.args }}
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/driftgate-out"
        mkdir -p "$out"
        # shellcheck disable=SC2086
        driftgate run "$SUITE" --out "$out/results.json" --baseline "$BASELINE" \
          --markdown "$out/report.md" $EXTRA_ARGS
        code=$?
        echo "report=$out/report.md" >> "$GITHUB_OUTPUT"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
        if [ "$code" -ge 2 ]; then exit "$code"; fi

    - name: Upload results
      if: always() && steps.run.outputs.exit_code != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/driftgate-out/results.json
        if-no-files-found: ignore
        retention-days: 90

    - name: Comment on pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.run.outputs.report != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPORT: ${{ steps.run.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker='<!-- driftgate-report -->'
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$REPORT" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$REPORT" >/dev/null
        fi

    - name: Enforce gate
      if: inputs.fail-on-gate == 'true' && steps.run.outputs.passed == 'false'
      shell: bash
      run: |
        echo "::error::driftgate gate failed. See the report in the job summary."
        exit 1
