[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "driftgate"
version = "0.2.0"
description = "Catch LLM quality drift before it merges: YAML eval suites, baseline diffs and a CI gate for prompts and agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muddasir Rizwan" }]
requires-python = ">=3.11"
keywords = ["llm", "evals", "evaluation", "ci", "regression-testing", "agents", "prompt-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.13"]
dev = [
  "anthropic>=2.13",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "types-jsonschema",
  "types-PyYAML",
]

[project.scripts]
driftgate = "driftgate.cli:main"

[project.urls]
Homepage = "https://github.com/Muddasirr/driftgate"
Issues = "https://github.com/Muddasirr/driftgate/issues"
Changelog = "https://github.com/Muddasirr/driftgate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/driftgate"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["driftgate"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
